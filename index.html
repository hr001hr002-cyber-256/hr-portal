<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOBER HR 人資工具入口網站">
  <title>SOBER HR Tools</title>
  <link rel="stylesheet" href="portal.css?v=20260731-appointment">
</head>
<body>
  <header class="portal-header">
    <div class="portal-shell">
      <a class="portal-brand" href="./" aria-label="SOBER HR Tools 首頁">
        <strong>SOBER HR Tools</strong>
        <span>人資作業工具</span>
      </a>
    </div>
  </header>

  <main class="portal-shell portal-main">
    <section class="portal-intro">
      <p>HR WORKSPACE</p>
      <h1>人資工具入口</h1>
      <span>選擇需要的工具。所有個人資料只在目前瀏覽器頁面中處理，不會上傳或儲存。</span>
    </section>

    <section class="tool-grid" aria-label="人資工具">
      <a class="tool-card" href="severance-calculator/">
        <span class="tool-icon" aria-hidden="true">算</span>
        <span class="tool-content">
          <small>CALCULATOR</small>
          <strong>資遣費計算工具</strong>
          <span>計算平均工資、預告期間與資遣費，並產生相關文件。</span>
        </span>
        <span class="tool-arrow" aria-hidden="true">→</span>
      </a>

      <a class="tool-card" href="appointment-letter.html">
        <span class="tool-icon" aria-hidden="true">聘</span>
        <span class="tool-content">
          <small>DOCUMENT</small>
          <strong>聘任通知書產生器</strong>
          <span>選擇公司與版本，填寫報到資料後即時預覽、列印或另存 PDF。</span>
        </span>
        <span class="tool-arrow" aria-hidden="true">→</span>
      </a>

      <a class="tool-card" href="records-center.html">
        <span class="tool-icon" aria-hidden="true">查</span>
        <span class="tool-content">
          <small>RECORDS</small>
          <strong>公告與薪資調整</strong>
          <span>查看本月新增筆數，搜尋公司公告及薪資調整文件。</span>
        </span>
        <span class="tool-arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>

  <footer>© SOBER HR Tools</footer>
</body>
</html>
