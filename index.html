<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOBER HR 人資作業工具入口">
  <title>SOBER HR Tools</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <header class="portal-header">
    <div class="portal-shell">
      <a class="portal-brand" href="./" aria-label="SOBER HR Tools 首頁">
        <strong>SOBER HR Tools</strong>
        <span>人資作業工具</span>
      </a>
    </div>
  </header>

  <main class="portal-shell portal-main">
    <section class="portal-intro">
      <p>HR WORKSPACE</p>
      <h1>人資工具入口</h1>
      <span>選擇要使用的工具。所有輸入資料只在目前頁面處理，不會上傳或儲存。</span>
    </section>

    <section class="tool-grid" aria-label="人資工具">
      <a class="tool-card" href="severance-calculator/">
        <span class="tool-icon" aria-hidden="true">計</span>
        <span class="tool-content">
          <small>CALCULATOR</small>
          <strong>資遣費計算工具</strong>
          <span>平均工資、資遣費、預告工資與相關文件</span>
        </span>
        <span class="tool-arrow" aria-hidden="true">→</span>
      </a>

      <div class="tool-card tool-card--future" aria-disabled="true">
        <span class="tool-icon" aria-hidden="true">聘</span>
        <span class="tool-content">
          <small>COMING NEXT</small>
          <strong>聘任通知書產生器</strong>
          <span>預留給五家公司的一般版與業務版通知書</span>
        </span>
        <span class="future-label">準備中</span>
      </div>
    </section>
  </main>

  <footer>© SOBER HR Tools</footer>
</body>
</html>
