<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="搜博科技公告文件產生器">
  <title>公告文件產生器｜SOBER HR Tools</title>
  <link rel="stylesheet" href="announcement-generator.css?v=20260902-mobile-print-v1">
  <link rel="stylesheet" href="print-core.css?v=20260902-mobile-print-v1">
  <link rel="stylesheet" href="protected-tool-gate.css?v=20260902a">
</head>
<body class="tool-locked">
  <section class="protected-tool-gate" id="protectedToolGate" aria-labelledby="protectedToolTitle">
    <div class="protected-tool-gate__card">
      <small>PROTECTED TOOL</small><h1 id="protectedToolTitle">公告文件產生器</h1><p>此功能僅限授權人員使用，請輸入功能區共用密碼。</p>
      <form id="protectedToolForm"><label>功能區密碼<input id="protectedToolPassword" type="password" autocomplete="current-password" required autofocus></label><button id="protectedToolSubmit" type="submit">進入功能區</button><p class="protected-tool-gate__error" id="protectedToolError" role="alert"></p></form>
    </div>
  </section>
  <header class="app-header no-print">
    <div class="app-shell app-header__inner">
      <a class="brand" href="./">SOBER HR Tools</a>
      <a class="home-link" href="./">返回工具首頁</a>
    </div>
  </header>

  <main class="app-shell page-layout">
    <aside class="editor no-print" aria-labelledby="pageTitle">
      <div class="editor__intro">
        <p>DOCUMENT GENERATOR</p>
        <h1 id="pageTitle">公告文件產生器</h1>
        <span>輸入內容後，右側會依 A4 實際高度自動分頁。</span>
      </div>

      <form id="announcementForm">
        <label>公告字號
          <input id="documentNumber" type="text" value="sb115035" placeholder="例如：sb115035" autocomplete="off">
        </label>
        <label>受文者
          <input id="recipient" type="text" placeholder="例如：AI企劃部、攝影部" autocomplete="off">
        </label>
        <label>主旨
          <textarea id="subject" class="compact-subject" rows="1" placeholder="請輸入公告主旨"></textarea>
        </label>
        <label>事由第一欄（選填）
          <textarea id="reasonLead" class="compact-reason" rows="2" placeholder="可留空；填寫時顯示在「事由：」後方"></textarea>
        </label>
        <div class="rich-field">
          <span class="rich-label">內文</span>
          <div class="editor-toolbar" role="toolbar" aria-label="內文格式工具">
            <details class="tool-visibility">
              <summary>功能顯示</summary>
              <div class="tool-visibility-options">
                <label><input type="checkbox" data-tool-toggle="font" checked> 字體大小</label>
                <label><input type="checkbox" data-tool-toggle="bullet" checked> 項目符號</label>
                <label><input type="checkbox" data-tool-toggle="paragraph"> 段落標題</label>
                <label><input type="checkbox" data-tool-toggle="emphasis"> 粗體／斜體／底線</label>
                <label><input type="checkbox" data-tool-toggle="alignment"> 對齊</label>
                <label><input type="checkbox" data-tool-toggle="indent"> 縮排</label>
                <label><input type="checkbox" data-tool-toggle="numbering"> 編號</label>
                <label><input type="checkbox" data-tool-toggle="table"> 表格</label>
              </div>
            </details>
            <span class="tool-group" data-tool-group="paragraph" hidden><select id="paragraphStyle" aria-label="段落格式">
              <option value="p">一般段落</option>
              <option value="h2">大標題</option>
              <option value="h3">小標題</option>
            </select></span>
            <span class="tool-group" data-tool-group="emphasis" hidden>
            <button type="button" data-command="bold" aria-label="粗體"><strong>B</strong></button>
            <button type="button" data-command="italic" aria-label="斜體"><em>I</em></button>
            <button type="button" data-command="underline" aria-label="底線"><u>U</u></button>
            </span>
            <span class="tool-group" data-tool-group="font"><select id="fontSize" aria-label="字體大小">
              <option value="10">10 pt</option>
              <option value="12">12 pt</option>
              <option value="14" selected>14 pt</option>
              <option value="18">18 pt</option>
              <option value="24">24 pt</option>
            </select></span>
            <span class="tool-group" data-tool-group="alignment" hidden>
            <button type="button" data-command="justifyLeft" aria-label="靠左對齊">靠左</button>
            <button type="button" data-command="justifyCenter" aria-label="置中對齊">置中</button>
            <button type="button" data-command="justifyRight" aria-label="靠右對齊">靠右</button>
            <button type="button" data-command="justifyFull" aria-label="左右對齊">左右</button>
            </span><span class="tool-group" data-tool-group="indent" hidden>
            <button type="button" data-command="outdent" aria-label="減少縮排">減少縮排</button>
            <button type="button" data-command="indent" aria-label="增加縮排">增加縮排</button>
            </span><span class="tool-group" data-tool-group="bullet"><select id="bulletStyle" aria-label="項目符號樣式">
              <option value="disc">● 實心圓</option>
              <option value="circle">○ 空心圓</option>
              <option value="square">■ 方塊</option>
              <option value="dash">— 橫線</option>
            </select>
            <button type="button" data-command="insertUnorderedList">項目符號</button>
            </span><span class="tool-group" data-tool-group="numbering" hidden><select id="numberingStyle" aria-label="編號樣式">
              <option value="decimal-dot">1. 2. 3.</option>
              <option value="decimal-cjk">1、2、3</option>
              <option value="cjk-ideographic">一、二、三</option>
              <option value="cjk-financial">壹、貳、參</option>
              <option value="upper-roman">Ⅰ、Ⅱ、Ⅲ</option>
              <option value="lower-roman">i、ii、iii</option>
              <option value="heavenly-stem">甲、乙、丙</option>
            </select>
            <button type="button" data-command="insertOrderedList">編號</button>
            <button type="button" id="continueNumbering">接續編號</button>
            </span><span class="tool-group" data-tool-group="table" hidden><label class="table-size">表格
              <input id="tableRows" type="number" min="1" max="12" value="3" aria-label="表格列數">
              ×
              <input id="tableColumns" type="number" min="1" max="8" value="3" aria-label="表格欄數">
            </label>
            <button type="button" id="insertTable">插入表格</button>
            <button type="button" id="narrowTableColumn">欄寬−</button>
            <button type="button" id="widenTableColumn">欄寬＋</button>
            <button type="button" id="equalizeTableColumns">平均欄寬</button>
            <button type="button" id="addTableRow">列＋</button>
            <button type="button" id="removeTableRow">列－</button>
            <button type="button" id="shadeTableCell">儲存格灰底</button>
            <button type="button" id="clearTableCellShade">取消灰底</button>
            <button type="button" id="verticalTableCell">直排文字</button>
            <button type="button" id="horizontalTableCell">橫排文字</button></span>
          </div>
          <div id="reasonEditor" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="請輸入內文，可設定段落、粗體、字級或插入表格。"><p><br></p></div>
        </div>

        <fieldset>
          <legend>頁尾設定</legend>
          <label class="check"><input id="showFund" type="checkbox"> 顯示（公基金）</label>
        </fieldset>

        <fieldset>
          <legend>公告日期</legend>
          <label class="radio"><input type="radio" name="dateMode" value="today" checked> 製作日</label>
          <label class="radio"><input type="radio" name="dateMode" value="custom"> 自訂日期</label>
          <input id="customDate" type="date" aria-label="自訂公告日期" disabled>
        </fieldset>

        <p class="privacy-note">內容只在本頁即時處理，不會上傳或儲存。</p>
        <div class="actions">
          <button class="button button--primary" type="button" id="downloadWord">下載 Word</button>
          <button class="button button--secondary" type="button" id="exportPdf">匯出 PDF</button>
          <button class="button button--secondary" type="button" id="printDocument">列印</button>
          <button class="button button--ghost" type="reset">清除內容</button>
        </div>
        <p class="action-hint" id="actionHint" aria-live="polite"></p>
      </form>
    </aside>

    <section class="preview-area" aria-label="公告預覽">
      <div class="preview-toolbar no-print">
        <span>即時預覽</span>
        <strong id="pageCount">1 頁</strong>
      </div>
      <div id="announcementPreview" class="pages"></div>
    </section>
  </main>

  <template id="pageTemplate">
    <article class="announcement-page">
      <header class="document-header">
        <img class="company-logo" src="assets/logos/sober.jpg" alt="搜博科技股份有限公司">
        <div class="header-rule"></div>
        <div class="title-row">
          <span aria-hidden="true"></span>
          <h2>公　告</h2>
          <p>公告字號：<span data-document-number></span></p>
        </div>
        <div class="document-fields">
          <p><strong>受文者：</strong><span data-recipient></span></p>
          <p><strong>主　旨：</strong><span data-subject></span></p>
          <p><strong>事　由：</strong><span data-reason-lead></span></p>
        </div>
      </header>
      <main class="document-body"><div class="reason-content"></div></main>
      <footer class="document-footer">
        <div><span>公告字號：</span><span data-footer-number></span><small data-fund>（公基金）</small></div>
        <span class="page-number"></span>
      </footer>
    </article>
  </template>

  <template id="closingTemplate">
    <section class="closing-block">
      <div class="signature-block">
        <strong>搜博科技股份有限公司</strong>
        <span class="signature-line" aria-label="簽名欄"></span>
      </div>
      <time class="document-date"></time>
    </section>
  </template>

  <script src="appointment-letter.payload.js?v=20260731-logo-alignment"></script>
  <script src="protected-tool-gate.js?v=20260902b"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="announcement-generator.js?v=20260902-mobile-v1"></script>
</body>
</html>
